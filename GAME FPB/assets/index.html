<title>My Activity, My Adventure</title>
<style>

*{box-sizing:border-box;margin:0;touch-action:none;user-select:none}
html,body{height:100%;background:#0e3d29;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink)}
#st{position:fixed;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--pp);overflow:hidden}
.scr{position:absolute;inset:0;display:none}.scr.on{display:block}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
#cover img{width:100%;height:100%;object-fit:cover}
#tp{position:absolute;bottom:18px;width:100%;text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 4px #000a;animation:bl 2.4s infinite}
@keyframes bl{50%{opacity:.35}}
#st[data-s=cover] #hud{display:none}
#hud{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;z-index:20}
#hud>*{background:#fffc;border-radius:30px;padding:8px 16px;font-size:15px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 #0002}
#hud .sp{flex:1;background:none;box-shadow:none}
#hud b{cursor:pointer;padding:2px 8px;border-radius:12px}#hud b.a{background:var(--lf);color:#fff}
input[type=range]{width:110px;accent-color:var(--lf)}
.card{position:absolute;background:#fff;border-radius:28px;box-shadow:0 8px 0 #0002;padding:36px}
#name{background:linear-gradient(160deg,var(--sk),var(--pp) 60%)}
#name .card{left:380px;top:200px;width:520px;text-align:center}
h1,h2{letter-spacing:-1px}h2{font-size:34px;margin-bottom:20px}
#pn{width:100%;font:inherit;font-size:24px;padding:14px 18px;border:3px solid var(--lf);border-radius:16px;margin-bottom:22px;text-align:center;user-select:text}
.big{background:var(--lf);color:#fff;font-size:24px;padding:14px 40px;border-radius:40px;box-shadow:0 5px 0 var(--lf2);transition:transform .1s}.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--lf2)}
#menu h1{position:absolute;left:70px;top:90px;font-size:68px;line-height:.95;width:700px;color:var(--lf2)}
#menu{background:linear-gradient(var(--pp) 0 55%,#f0dfb4 55%)}
.tiles{position:absolute;left:60px;right:60px;top:330px;display:flex;gap:22px}
.tl{flex:1;height:320px;background:#fff;border-radius:0 0 22px 22px;box-shadow:0 8px 0 #0002;text-align:left;padding:100px 20px 0;position:relative;transition:transform .2s}
.tl:hover{transform:translateY(-8px)}
.tl:before{content:"";position:absolute;left:0;right:0;top:0;height:76px;border-radius:0 0 26px 26px;background:repeating-linear-gradient(90deg,var(--c) 0 26px,#fff 26px 52px)}
.tl b{font-size:30px;display:block;margin-bottom:8px}.tl span{font-size:16px;opacity:.75}
#learn,#rank,#dev,#res{background:linear-gradient(160deg,var(--pp),var(--sk))}
#lg{position:absolute;left:60px;right:60px;top:130px;display:flex;gap:26px}
.gc{flex:1;background:#fff;border-radius:24px;padding:28px;box-shadow:0 8px 0 #0002;min-height:440px}
.gc h3{font-size:30px;margin-bottom:10px}.gc p{font-size:18px;min-height:76px;opacity:.8}
.gc button{display:block;width:100%;margin-top:16px;padding:16px;border-radius:16px;background:var(--mg);font-size:22px;font-weight:bold;box-shadow:0 4px 0 #b9760a}
.gc button:nth-child(2){background:#f7c25e}.gc button:hover{filter:brightness(1.07)}
#rk{position:absolute;left:260px;top:100px;width:760px}
.rw{display:flex;gap:20px;background:#fff;border-radius:16px;padding:12px 24px;margin-bottom:10px;font-size:22px;align-items:center}
.rw i{font-style:normal;font-weight:bold;width:40px;color:var(--ch)}.rw span{flex:1}.rw u{text-decoration:none;font-size:15px;opacity:.6}
#dev .photo{position:absolute;left:230px;top:110px;width:340px;height:460px;border-radius:170px 170px 18px 18px;background:var(--lf) center/cover;box-shadow:12px 12px 0 var(--mg)}
#dev .t{position:absolute;left:660px;top:230px;width:480px}#dev .t h2{font-size:54px;line-height:1}#dev .t p{font-size:26px;margin-top:14px}
#gh{position:absolute;left:260px;top:20px;font-size:20px;z-index:21;background:#fffc;padding:8px 18px;border-radius:30px;display:flex;gap:20px}
#story{position:absolute;left:60px;top:100px;width:700px;font-size:26px;line-height:1.35;background:#fff;border-radius:22px;padding:22px 28px;box-shadow:0 6px 0 #0002}
#items{position:absolute;left:800px;top:100px;width:420px;display:flex;gap:16px}
.stk{flex:1;background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:0 6px 0 #0002}
.ics{display:flex;justify-content:center;height:44px}.ics svg{margin-left:-14px}.ics svg:first-child{margin:0}
.stk b{font-size:34px;display:block}.stk span{font-size:15px;opacity:.7}
#arena{position:absolute;left:0;top:330px;width:1280px;height:390px}
.bags{position:absolute;left:520px;top:70px;display:flex;gap:30px}
.bag{width:200px;height:230px;border:4px solid #7fbfb0;border-top:0;border-radius:6px 6px 50px 50px;background:#ffffffb0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.bag:before{content:"";position:absolute;top:-30px;width:90px;height:34px;border:5px solid #7fbfb0;border-bottom:0;border-radius:40px 40px 0 0}
.bag b,.opt b{font-size:64px;line-height:1}.bag span,.opt span{font-size:16px;opacity:.7}
.home{position:absolute;left:80px;top:120px;width:150px;height:110px;border:3px dashed #0004;border-radius:14px}
#crate{position:absolute;display:none;width:150px;height:110px;background:#c58a4a;border-radius:10px;border:4px solid #8a5a26;z-index:12;text-align:center;font-size:15px;font-weight:bold;color:#fff;padding-top:8px;cursor:grab}
#crate div{display:flex;justify-content:center;margin-top:6px}#crate svg{margin:0 -4px}
.hint{position:absolute;left:240px;top:290px;width:760px;font-size:17px;opacity:.75}
.opt{position:absolute;top:70px;width:340px;height:200px;background:#fff;border-radius:24px;box-shadow:0 8px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .15s}.opt:hover{transform:translateY(-6px)}
.stp{position:absolute;left:300px;top:50px;width:680px;text-align:center}
.stp .r{display:flex;justify-content:center;align-items:center;gap:36px}
.stp .r button{width:84px;height:84px;border-radius:50%;background:var(--mg);font-size:48px;box-shadow:0 5px 0 #b9760a}
.stp .r b{font-size:110px;width:200px}.stp small{font-size:20px;display:block}
.calc{font-size:24px;margin:18px 0 22px;line-height:1.7}.calc em{font-style:normal;color:var(--ch);font-weight:bold}
#toast{max-width:760px;text-align:center}
#lv{display:inline-block;width:46px;height:8px;background:#0002;border-radius:6px;overflow:hidden;position:relative}#lv:after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--l,0%);background:var(--ch)}
#tr{position:absolute;right:24px;top:66px;max-width:420px;background:#1f2b24;color:#fff;padding:6px 16px;border-radius:20px;font-size:16px;z-index:36;display:none}
.pile{position:absolute;top:10px;width:175px;height:250px;background:#fff9;border:3px dashed #0003;border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px}
.it{display:inline-flex;cursor:grab;line-height:0}.it.fl{position:absolute;z-index:45;pointer-events:none;transform:scale(1.4)}
.bag.mv{width:118px;height:200px;justify-content:flex-start;padding-top:8px}.bag .it svg{width:22px;height:22px}
.bi{display:flex;flex-wrap:wrap;align-content:flex-start;width:100%;padding:0 6px;height:140px;overflow:hidden}
.bag.mv small{position:absolute;bottom:8px;font-size:15px;display:flex;align-items:center;gap:3px;opacity:1}
.bags.mv{left:420px;top:70px;gap:14px;width:830px;flex-wrap:wrap}
.pn{width:100%;background:#fff;border-radius:22px;padding:16px;text-align:center;box-shadow:0 6px 0 #0002}
.pn .r{display:flex;align-items:center;justify-content:center;gap:16px;font-size:22px}.pn .r button{width:50px;height:50px;border-radius:50%;background:var(--mg);font-size:30px}.pn .r b{font-size:44px}
.pn .big{font-size:20px;padding:10px 26px;margin:12px 6px 0}.pn .big.s{background:var(--mg);color:var(--ink);box-shadow:0 5px 0 #b9760a}
#ban{position:absolute;left:60px;right:60px;bottom:18px;background:var(--ink);color:#fff;border-radius:20px;padding:16px 26px;font-size:22px;line-height:1.4;z-index:30;display:none}

#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:var(--ch);color:#fff;padding:10px 22px;border-radius:30px;z-index:50;display:none}
#cv{position:absolute;inset:0;background:var(--lf);z-index:60;transform:translateX(-101%);pointer-events:none}
#cv.in{transform:none;transition:transform .45s ease-in;pointer-events:auto}#cv.out{transform:translateX(101%);transition:transform .45s ease-out}

function micStop(){micOn=false;if(rec){rec.onend=null;try{rec.stop()}catch(e){}}rec=null;if(mic)mic.getTracks().forEach(x=>x.stop());mic=null;$('#lv').style.setProperty('--l','0%');render()}
function meter(){if(!micOn)return;const d=new Uint8Array(an.fftSize);an.getByteTimeDomainData(d);let m=0;for(const v of d)m=Math.max(m,Math.abs(v-128));$('#lv').style.setProperty('--l',Math.min(100,m*1.6)+'%');requestAnimationFrame(meter)}
function setNb(v){const mv=G.q.mode=='move';G.nb=Math.max(1,Math.min(mv?6:40,v));mv?mkBags():calc()}
function cmd(x){x=x.toLowerCase();const e=$('#tr');e.textContent='“'+x+'”';e.style.display='block';clearTimeout(trT);trT=setTimeout(()=>e.style.display='none',3500);if(busy)return;const n=num(x),h=r=>r.test(x);
if(h(/kembali|balik|back/)&&!['menu','name','cover'].includes(cur))return go(cur=='game'?G.from:'menu');
if(cur=='menu'){if(h(/belajar|learn|diajar/))return go('learn');if(h(/bermain|main|play|maén|maen/))return start('play');if(h(/peringkat|rank/))return go('rank');if(h(/pengembang|developer|pamekar/))return go('dev')}
if(cur=='res'){if(h(/lagi|again|deui/))return start(G.kind,G.mode,G.lv);if(h(/menu/))return go('menu')}
if(cur!='game'||G.lock)return;const q=G.q;
if(h(/baca|read|bacakeun|dengar|listen/))return narr();
if(q.mode=='quiz'){if(n==null)return;return q.opts.includes(n)?ans(n==q.ans):msg('mn')}
if(h(/tambah|tambih|plus|add|more/))return setNb(G.nb+1);if(h(/kurang|kirang|minus|less|remove|hapus/))return setNb(G.nb-1);
if(q.mode=='move'&&h(/ulang|reset|deui/))return showQ();
if(h(/periksa|pariksa|cek|check|tutup|close|done|selesai/))return q.mode=='move'?chk():ans(G.nb==q.g);
if(n!=null&&n>0)setNb(n)}
/* kontrol */
document.addEventListener('click',e=>{const x=e.target.closest('button,[data-l],[data-go],#vo,#bk,#mc,#cover');if(!x||busy)return;
if(x.id=='cover'){bgm.play().catch(()=>{});return go('name')}
if(x.dataset.l){L=x.dataset.l;localStorage.fpbL=L;if(rec){rec.lang=RL();try{rec.stop()}catch(e){}}render();return narr()}
if(x.id=='mc')return micOn?micStop():micStart();
if(x.id=='vo'){vOn=!vOn;if(!vOn)speechSynthesis.cancel();return render()}
if(x.id=='bk')return go(cur=='game'?G.from:'menu');
if(x.id=='ok'){P=$('#pn').value.trim()||'Player';localStorage.fpbP=P;return go('menu')}
if(x.dataset.go)return go(x.dataset.go);if(x.dataset.play)return start('play');
if(x.dataset.m)return start('learn',x.dataset.m,+x.dataset.lv);
if(x.id=='ag')return start(G.kind,G.mode,G.lv);if(x.id=='hm')return go('menu');
if(cur=='game'&&!G.lock){if(x.classList.contains('opt'))ans(+x.dataset.v==G.q.ans);
if(x.id=='bm'||x.id=='bp'){G.nb=Math.max(1,Math.min(6,G.nb+(x.id=='bp'?1:-1)));return mkBags()}if(x.id=='ck')return chk();if(x.id=='rt')return showQ();
if(x.id=='mi'){G.nb=Math.max(1,G.nb-1);calc()}if(x.id=='pu'){G.nb=Math.min(40,G.nb+1);calc()}if(x.id=='cl')ans(G.nb==G.q.g)}});
$('#cover').addEventListener('click',()=>{});
$('#vol').value=vol;$('#vol').oninput=e=>{vol=+e.target.value;localStorage.fpbV=vol;bgm.volume=vol};
$('#pn').value=P;$('#pn').onkeydown=e=>{if(e.key=='Enter')$('#ok').click()};
$('#ph').style.backgroundImage='url("assets/foto%20pengembang.jpeg")';
if(window.speechSynthesis)speechSynthesis.getVoices();
render();
</script></body></html>

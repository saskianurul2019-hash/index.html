<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efek Pipehand HTML Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111; /* Latar belakang gelap agar efek lebih terlihat */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Mengatur ukuran canvas penuh layar
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Array untuk menyimpan koordinat riwayat posisi tangan/kursor
        let trail = [];
        const MAX_TRAIL_LENGTH = 20; // Panjang ekor efek pipa

        // Mencatat posisi kursor mouse (bisa diganti dengan koordinat tangan dari AI/sensor)
        window.addEventListener('mousemove', (e) => {
            trail.push({ x: e.clientX, y: e.clientY });
            
            // Batasi panjang array agar ekor pipa tidak memanjang selamanya
            if (trail.length > MAX_TRAIL_LENGTH) {
                trail.shift();
            }
        });

        // Game Loop / Animasi
        function animate() {
            // Bersihkan canvas setiap frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (trail.length > 1) {
                for (let i = 1; i < trail.length; i++) {
                    const p1 = trail[i - 1];
                    const p2 = trail[i];

                    // Membuat efek memudar (semakin ke ujung ekor, semakin transparan)
                    const alpha = i / trail.length;
                    
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);

                    // Mengatur gaya garis (Efek Pipa Glowing) - Fixed template string literal syntax
                    ctx.strokeStyle = `rgba(0, 255, 204, ${alpha})`; // Warna neon cyan
                    ctx.lineWidth = i * 0.8; // Semakin dekat dengan kursor/tangan, pipa semakin tebal
                    ctx.lineCap = 'round';   // Membuat ujung sambungan melingkar halus
                    ctx.lineJoin = 'round';

                    // Memberikan efek shadow/neon glow
                    ctx.shadowColor = '#00ffcc';
                    ctx.shadowBlur = 15;

                    ctx.stroke();
                }
            }

            // Hapus ekor secara perlahan jika mouse berhenti bergerak
            if (trail.length > 0) {
                trail.shift();
            }

            requestAnimationFrame(animate);
        }

        // Jalankan animasi
        animate();
    </script>
</body>
</html>
